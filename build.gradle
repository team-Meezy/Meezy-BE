plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.gatling.gradle' version '3.13.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Meezy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "software.amazon.awssdk:s3:2.20.40"
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation platform("org.springframework.ai:spring-ai-bom:1.0.0")
    implementation "org.springframework.ai:spring-ai-starter-model-openai"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j:9.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    gatlingImplementation 'io.gatling:gatling-core-java:3.13.4'
    gatlingImplementation 'io.gatling:gatling-http-java:3.13.4'
    gatlingImplementation 'io.gatling.highcharts:gatling-charts-highcharts:3.13.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('compileGatlingJava') {
    options.release = 17
}

gatling {
    def gatlingJvmBaseArgs = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED'
    ]
    def forwardKeys = ['baseUrl','wsBaseUrl','users','durationSeconds','rampUpSeconds',
        'teamId','meetingId','accountId','password','burstUsers','messagesPerUser',
        'fromUserId','toUserId','wsEndpoint','jwtHeader','jwtPrefix','accessToken'] as Set
    jvmArgs = gatlingJvmBaseArgs + System.properties
        .findAll { k, v -> forwardKeys.contains(k) }
        .collect { k, v -> "-D${k}=${v}" as String }

}
