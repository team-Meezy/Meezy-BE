spring:
  application:
    name: Meezy

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  main:
    allow-bean-definition-overriding: true

  jwt:
    secretKey: ${JWT_SECRET}
    accessExp: ${ACCESS_EXP}
    refreshExp: ${REFRESH_EXP}
    header: ${HEADER}
    prefix: ${PREFIX}

  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: email

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7
          max-tokens: 3000

      audio:
        transcription:
          options:
            model: whisper-1
            language: ko
            response-format: text

      prompt:
        feedback: ${AI_FEEDBACK_PROMPT}
        summary: ${AI_SUMMARY_PROMPT}


chat:
  rabbit:
    exchange-name: ${CHAT_RABBIT_EXCHANGE_NAME}
    queue-prefix: ${CHAT_RABBIT_QUEUE_PREFIX}
  websocket:
    endpoint: ${CHAT_WS_ENDPOINT}
    broker-prefix: ${CHAT_WS_BROKER_PREFIX}
    app-prefix: ${CHAT_WS_APP_PREFIX}
    allowed-origins: ${CHAT_WS_ALLOWED_ORIGINS}

cloud:
  file:
    garage:
      bucket: ${BUCKET_NAME}
      endpoint: ${GARAGE_ENDPOINT}
      url-prefix: ${MEEZY_IMAGE_FOLDER}
      region: ${GARAGE_REGION}
    credentials:
      access-key: ${GARAGE_ACCESS_KEY}
      secret-key: ${GARAGE_SECRET_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

oauth:
  redirect:
    frontend-url: ${FRONTEND_URL}

webrtc:
  ice-servers:
    - urls: ${WEBRTC_STUN_URL:stun:stun.l.google.com:19302}
    - urls: ${WEBRTC_TURN_URL:turn:localhost:3478}
      username: ${WEBRTC_TURN_USERNAME:}
      credential: ${WEBRTC_TURN_CREDENTIAL:}

server:
  forward-headers-strategy: framework

logging:
  level:
    com.example.meezy.bc.collaboration.participation_metrics: DEBUG
    com.example.meezy.config.websocket: DEBUG
